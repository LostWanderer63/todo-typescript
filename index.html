<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </header>

    <form class="task-form" id="taskForm" novalidate>
      <div class="field field-name">
        <label for="taskName">Task</label>
        <input type="text" id="taskName" placeholder="e.g. Submit assignment" autocomplete="off" required />
      </div>
      <div class="field field-date">
        <label for="taskDue">Due date</label>
        <input type="date" id="taskDue" required />
      </div>
      <button type="submit" class="btn-add">Add task</button>
    </form>
    <p class="form-error" id="formError" role="alert"></p>

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Show tasks">
        <button type="button" data-filter="all" class="active" aria-pressed="true">All</button>
        <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button type="button" class="btn-clear" id="clearCompleted" hidden>Clear completed</button>
    </div>

    <ul class="task-list" id="taskList" aria-label="Tasks"></ul>
    <p class="empty" id="emptyState">No tasks yet. Add your first one above.</p>
  </main>

  <!-- Compiled by tsc from src/*.ts (npm run build). Order matters: types, storage, app. -->
  <script src="dist/types.js"></script>
  <script src="dist/storage.js"></script>
  <script src="dist/app.js"></script>
</body>
</html>
